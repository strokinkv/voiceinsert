name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Test
        run: ./scripts/test.ps1
        shell: pwsh

      - name: Build installer
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInsertSetup
          path: artifacts/installer/VoiceInsertSetup.exe

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $lines = Get-Content -LiteralPath CHANGELOG.md
          $start = $null
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+$([regex]::Escape($tag))(\s|-|$)") {
              $start = $i
              break
            }
          }
          if ($null -eq $start) {
            throw "CHANGELOG.md does not contain a section for $tag."
          }

          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+") {
              $end = $i
              break
            }
          }

          $lines[$start..($end - 1)] | Set-Content -LiteralPath release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: release-notes.md
          files: artifacts/installer/VoiceInsertSetup.exe
