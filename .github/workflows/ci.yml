name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/VoiceInsert.App.Tests/VoiceInsert.App.Tests.csproj

      - name: Build
        run: dotnet build tests/VoiceInsert.App.Tests/VoiceInsert.App.Tests.csproj --configuration Release --no-restore -warnaserror

      - name: Format check
        run: dotnet format VoiceInsert.slnx --verify-no-changes --no-restore

      - name: Dependency audit
        run: dotnet list VoiceInsert.slnx package --vulnerable --include-transitive

      - name: Test with coverage
        run: dotnet test tests/VoiceInsert.App.Tests/VoiceInsert.App.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-results
          path: TestResults
